<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <style>
  .chart-box { height: 350px; position: relative; }
  .chart-box canvas { width: 100% !important; height: 100% !important; }
  #status { display: none; }
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气数据看板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 350px; position: relative; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">城市天气数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：昆明市气象局</p >
  </header>
  <p id="status" class="alert alert-warning"></p >
    <div class="mb-3">
  <button class="btn btn-primary btn-sm me-2 city-btn active" data-city="kunming">昆明</button>
  <button class="btn btn-outline-primary btn-sm city-btn" data-city="dali">大理</button>
  <button class="btn btn-outline-primary btn-sm city-btn" data-city="lijiang">丽江</button>
</div>
  <section class="row g-3 mt-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2 class="h5" id="bar-title">天气图表加载中...</h2>
          <div id="bar-chart" class="chart-box"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2 class="h5" id="line-title">天气图表加载中...</h2>
          <div class="chart-box"><canvas id="line-chart"></canvas></div>
        </div>
      </div>
    </div>
  </section>
  <section class="row g-3 mt-3">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <h2 class="h5">城市湿度占比</h2>
        <div id="pie-chart" class="chart-box"></div>
      </div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.js"></script>
<script src="app.js"></script>
 
</body>
</html>
