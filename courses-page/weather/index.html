<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 350px; position: relative; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">城市天气数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：昆明市气象局</p >
  </header>
  <p id="status" class="alert alert-warning"></p >
  <section class="row g-3 mt-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2 class="h5" id="bar-title">天气图表加载中...</h2>
          <div id="bar-chart" class="chart-box"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2 class="h5" id="line-title">天气图表加载中...</h2>
          <div class="chart-box"><canvas id="line-chart"></canvas></div>
        </div>
      </div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
