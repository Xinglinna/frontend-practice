<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园三维导览</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #back-btn {
            position: absolute; top: 20px; left: 20px;
            z-index: 100; padding: 10px 20px;
            background: #0d6efd; color: white;
            text-decoration: none; border-radius: 5px;
            font-family: sans-serif;
        }
        #back-btn:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <a href="../index.html" id="back-btn">← 返回首页</a >
    <script src="../libs/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(5, 5, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 灯光
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// 地面
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7bc96f });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 建筑生成函数
function createBuilding(name, x, z, w, h, d, color) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color });
    const box = new THREE.Mesh(geo, mat);
    box.position.set(x, h / 2, z);
    scene.add(box);

    // 文字标签
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'black';
    ctx.font = '32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, 128, 40);

    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.set(x, h + 1, z);
    sprite.scale.set(3, 0.75, 1);
    scene.add(sprite);
}

// 三个建筑
createBuilding('教学楼', -4, -2, 3, 3, 2, 0x4a90e2);
createBuilding('图书馆', 4, -2, 3, 2, 2, 0xe67e22);
createBuilding('宿舍楼', 0, 4, 4, 4, 2, 0x9b59b6);

// 树
function createTree(x, z) {
    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, 0.5, z);
    scene.add(trunk);

    const leafGeo = new THREE.SphereGeometry(0.7, 16, 16);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
    const leaves = new THREE.Mesh(leafGeo, leafMat);
    leaves.position.set(x, 1.5, z);
    scene.add(leaves);
}

createTree(-7, 4);
createTree(7, 4);

// 动画
const animate = () => {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
};
animate();

// 窗口大小变化
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
    </script>
</body>
</html>
