<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书收藏</title>
    </style>
</head>
<body>
    <h1>图书收藏</h1>
    <form id="task-form">
        <div class="input-group">
            <input type="text" id="book-name" placeholder="书名"> 
            <input type="text" id="book-author" placeholder="作者"> 
            <input type="number" id="book-rating" placeholder="评分(0-10)" step="0.1"> 
        </div>
        <button type="submit">添加图书</button>
    </form>
    <p class="tip" id="tip"></p >
    
    <div class="filters">
        <button data-filter="all">全部</button>
        <button data-filter="high">高分(≥8)</button>
        <button data-filter="low">低分(<8)</button>
    </div>
    
    <ul id="task-list"></ul>
    <script src="app.js"></script>
</body>
</html>
