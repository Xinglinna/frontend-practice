<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>城市三维导览</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #back-btn {
            position: absolute; top: 20px; left: 20px;
            z-index: 100; padding: 10px 20px;
            background: #0d6efd; color: white;
            text-decoration: none; border-radius: 5px;
            font-family: sans-serif;
        }<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    </style>
</head>
<body>
    <a href="index.html " id="back-btn">← 返回首页</a >

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdbeafe);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x9ca3af })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function createBuilding(name, x, z, w, h, d, color) {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color })
            );
            box.position.set(x, h / 2, z);
            scene.add(box);

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'black';
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, 128, 40);

            const sprite = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true })
            );
            sprite.position.set(x, h + 1, z);
            sprite.scale.set(3, 0.75, 1);
            scene.add(sprite);
        }

        createBuilding('写字楼', -4, -2, 3, 4, 2, 0x4a90e2);
        createBuilding('商场', 4, -2, 3, 2, 3, 0xe67e22);
        createBuilding('住宅区', 0, 4, 4, 3, 2, 0x9b59b6);

        function createTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 1, 8),
                new THREE.MeshStandardMaterial({ color: 0x8b4513 })
            );
            trunk.position.set(x, 0.5, z);
            scene.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(0.7, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0x2ecc71 })
            );
            leaves.position.set(x, 1.5, z);
            scene.add(leaves);
        }

        createTree(-7, 4);
        createTree(7, 4);

        const animate = () => {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        };
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
